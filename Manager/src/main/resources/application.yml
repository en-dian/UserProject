# ============================================================
# 服务器配置
# ============================================================
server:
  servlet:
    # 应用上下文路径，所有接口访问时都需要加上 /hedadmin 前缀
    # 例如：http://localhost:8081/hedadmin/user/list
    context-path: '/hedadmin'
  # 服务启动端口，默认是 8080，这里改为 8081 避免端口冲突
  port: 8081

# ============================================================
# Spring 框架核心配置
# ============================================================
spring:
  # ---------- 数据源配置（连接数据库） ----------
  datasource:
    # MySQL 8.0 及以上版本的 JDBC 驱动类名
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接 URL
    # 注意：生产环境建议追加时区参数 serverTimezone=Asia/Shanghai
    url: jdbc:mysql://localhost:3306/mydb
    # 数据库登录用户名
    username: root
    # 数据库登录密码（生产环境请勿明文存储，建议使用 Jasypt 加密）
    password: 123456
    # ---------- JMX 管理配置 ----------
    jmx:
      # 关闭数据源的 JMX 功能，减少不必要的系统开销
      # JMX 通常用于运行时监控和动态调参，纯 Web 应用场景下可以关闭
      enabled: false

# ============================================================
# MyBatis-Plus 配置（ORM 框架，增强 MyBatis）
# ============================================================
mybatis-plus:
  # ---------- 运行时行为配置 ----------
  configuration:
    # 设置 SQL 日志打印实现类，将执行的 SQL 输出到控制台
    # 便于开发阶段调试 SQL，生产环境建议关闭或改为文件日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  # ---------- 全局配置 ----------
  global-config:
    db-config:
      # 逻辑删除字段名：对应实体类中的字段名称
      # 使用逻辑删除后，DELETE 操作会变成 UPDATE 操作，数据不会被物理删除
      logic-delete-field: deleted
      # 逻辑已删除值：当 deleted 字段值为 1 时，表示该记录已被逻辑删除
      logic-delete-value: 1
      # 逻辑未删除值：当 deleted 字段值为 0 时，表示该记录未被删除
      # MyBatis-Plus 在执行查询时会自动追加条件：WHERE deleted = 0
      logic-not-delete-value: 0

  # ---------- 类型别名配置 ----------
  # 配置实体类所在的包路径，配置后 XML 映射文件中可以直接使用类名（不区分大小写）
  # 例如：不用写 com.example.admin.entity.User，直接写 User 即可
  type-aliases-package: com.example.admin.entity

# ============================================================
# SpringDoc OpenAPI 3.0 配置（生成 API 文档）
# ============================================================
springdoc:
  # ---------- Swagger UI 界面配置 ----------
  swagger-ui:
    # Swagger UI 的访问路径，访问地址为：/hedadmin/swagger-ui.html
    path: /swagger-ui.html
    # 标签排序规则：按字母顺序（alpha）排序，使文档结构更清晰
    tags-sorter: alpha
    # 操作（接口）排序规则：按字母顺序（alpha）排序
    operations-sorter: alpha

  # ---------- API 文档 JSON 数据接口配置 ----------
  api-docs:
    # OpenAPI 3.0 规范文档的访问路径，输出 JSON 格式的接口描述数据
    # 访问地址为：/hedadmin/v3/api-docs
    path: /v3/api-docs

  # ---------- 文档分组配置 ----------
  group-configs:
    # 定义一个名为 "default" 的文档组
    - group: 'default'
      # 匹配所有路径下的接口，即扫描所有 Controller
      paths-to-match: '/**'
      # 只扫描指定包下的 Controller 生成文档
      # 注意：这里配置的是 com.example.hedadmin，而非上面的 type-aliases-package
      packages-to-scan: com.example.hedadmin

# ============================================================
# Knife4j 增强配置（Swagger UI 的增强版，国内常用）
# ============================================================
knife4j:
  # 启用 Knife4j 增强功能，开启后访问 /doc.html 获得更强大的接口调试界面
  # 相比原生 Swagger UI，提供了更美观的界面、接口搜索、离线文档下载等增强功能
  enable: true
  setting:
    # 设置界面语言为简体中文
    language: zh_cn